services:
  - type: web
    name: mummas-proud-school
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/content
    disk:
      name: school-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ENQUIRY_DB_PATH
        value: /var/data/enquiries.sqlite
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: mummaproud2003@gmail.com
      - key: ADMIN_PASSWORD_HASH
        sync: false
